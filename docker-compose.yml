services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couplecheck-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - couplecheck-network

  proxy:
    image: caddy:2-alpine
    container_name: couplecheck-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - couplecheck-network

networks:
  couplecheck-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
